version: 2

models:
  - name : fct_orders
    description : "Table de faits des commandes"
    columns :
      - name : order_id
        tests : [unique, not_null]

      - name : customer_unique_id
        tests : 
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id

      - name: review_score
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
              config:
                where: "review_score is not null"

  - name : fct_orders_items
    columns :
      - name : order_item_pk
        tests : [unique, not_null]

      - name : order_id
        tests : [not_null]
  
  - name : dim_customers
    columns :
      - name : customer_unique_id
        tests : [unique, not_null]

      - name : customer_segment
        tests : 
          - not_null
          - accepted_values:
              values: ['loyal', 'repeat', 'one time']

  - name : dim_products
    columns :
      - name : product_id
        tests : [unique, not_null]

  - name : dim_sellers
    columns :
      - name : seller_id
        tests : [unique, not_null]
